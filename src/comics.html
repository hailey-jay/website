<div class="section-header">
    <h1>Comics</h1>
</div>

<p style="max-width:56ch;margin-bottom:1.4rem;">A selection of comics I have drawn. Subject matter varies. Clearly inspired by <a href="https://xkcd.com/">xkcd</a>. All humor is derivative, but mine is especially so.</p>

<div class="gallery-grid">
    {body}
</div>

§CARD§

<div class="gallery-card">
    <button class="comic-thumb thumb" data-src="{src}" data-alt="{alt}" data-caption="{caption}" aria-label="View comic: {caption}">

            <img src="{src}" alt="{alt}" width="{w}" height="{h}">
    </button>
    <p class="gallery-title">{caption}</p>
</div>
