<!-- The walkthrough. Title, standfirst, and body come from
     src/data/sagitta/tutorial.html; the body may use [image ...] directives,
     the same ones a blog post uses. -->

<div class="sg-tutorial">
    <div class="sg-tutorial-header">
        <h1 class="sg-tutorial-title">{title}</h1>
        <p class="sg-standfirst">{standfirst}</p>
    </div>
    <div class="sg-tutorial-body sg-prose">
        {body}
    </div>
    <p class="sg-more"><a href="{base}app/">Open the editor and try it →</a></p>
</div>
