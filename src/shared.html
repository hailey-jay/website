§CARD§

<div class="gallery-card">
    <button class="{thumb_class} thumb" data-src="{src}" data-alt="{alt}" data-caption="{caption}" aria-label="{label}: {caption}">
        <img {img_attrs} alt="{alt}" loading="lazy" decoding="async">
    </button>
    <p class="gallery-title">{caption}</p>
</div>
