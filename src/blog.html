<div class="section-header">
    <h1>Blog</h1>
</div>

<div id="blog-index">
    <p style="max-width:60ch;margin-bottom:1.6rem;">Occasional writing on math, my projects, and whatever else is on my mind. Available as an <a href="rss.xml" class="rss-link" aria-label="RSS feed">
    <svg class="rss-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="5" cy="19" r="2"/>
        <path d="M4 4a16 16 0 0 1 16 16M4 11a9 9 0 0 1 9 9"/>
    </svg>
    RSS feed</a>.</p>
    <div class="blog-list">
        {entries}
    </div>
</div>

{posts}

§ENTRY§

<div class="blog-entry">
    <a href="#blog-{slug}" class="blog-entry-link">
        {thumb}
        <span class="blog-entry-title">{title}</span>
        <span class="blog-entry-date">{date}</span>
        <span class="blog-entry-teaser">{teaser}</span>
    </a>
</div>

§POST§

<div class="blog-post" id="blog-{slug}" data-blog-entry="true">
    <a href="#blog" class="blog-back">← All posts</a>
    <div class="blog-post-header">
        <h2 class="blog-post-title">{title}</h2>
        <p class="blog-post-date">{date}</p>
    </div>
    <div class="blog-post-body">
        {body}
    </div>
</div>

§GRID§

<div class="gallery-grid">
  {cards}
</div>

§FIGURE§

<figure class="blog-figure">
  <button class="{thumb_class} thumb" data-src="{src}" data-alt="{alt}" data-caption="{caption}" aria-label="{label}: {caption}">
    <img {img_attrs} alt="{alt}" loading="lazy" decoding="async">
  </button>
  <figcaption>{caption}</figcaption>
</figure>
