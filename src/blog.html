<div class="section-header">
    <h1>Blog</h1>
    <a class="header-badge" href="rss.xml" aria-label="RSS feed"><svg class="rss-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="19" r="2"/><path d="M4 4a16 16 0 0 1 16 16M4 11a9 9 0 0 1 9 9"/></svg>RSS</a>
</div>

<div id="blog-index">
    <p class="section-intro">Occasional writing on math, my projects, and whatever else is on my mind.</p>
    <div class="blog-list">
        {entries}
    </div>
</div>

{posts}

§ENTRY§

<div class="blog-entry"{style}>
    <a href="#blog-{slug}" class="blog-entry-link">
        {thumb}
        <span class="blog-entry-title">{title}</span>
        <span class="blog-entry-date">{date}</span>
        <span class="blog-entry-teaser">{teaser}</span>
    </a>
</div>

§POST§

<div class="blog-post" id="blog-{slug}" data-blog-entry="true"{style}>
    <a href="#blog" class="blog-back">← All posts</a>
    <div class="blog-post-header">
        <h2 class="blog-post-title">{title}</h2>
        <p class="blog-post-date">{date}</p>
    </div>
    <div class="blog-post-body">
        {body}
    </div>
</div>
