<div class="section-header">
    <h1>About</h1>
</div>

<figure class="about-photo">
    <img src="images/hailey-500.webp" srcset="images/hailey-300.webp 300w, images/hailey-500.webp 500w"
sizes="(max-width: 480px) 100vw, 148px" width="148" height="185" alt="{photo_alt}" loading="eager">
    <figcaption>{photo_caption}<br>“<span id="about-splash">{splash}</span>”</figcaption>
</figure>

<p class="about-name">{name} <span class="about-pronoun">({pronouns})</span></p>

<div class="about-meta">
    {meta}
</div>
<hr class="pink">

{bio}

<div class="lately">
    <div class="lately-label">Lately</div>
    {lately}
</div>

<div class="blog-carousel-wrap">
    <p class="blog-carousel-label">From the blog</p>
    <div class="blog-carousel" id="blog-carousel"></div>
</div>
<script type="application/json" id="blog-carousel-data">{blog_images_json}</script>
